name: Course 04 beginner pass

on:
  push:
    paths:
      - '.github/workflows/course04-beginner-pass.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve course 04 for beginners
        run: python3 .github/scripts/course04_beginner_pass.py
      - name: Commit course update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git commit -m 'Improve course 04 beginner guidance'
          git push
