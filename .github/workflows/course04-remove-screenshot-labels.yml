name: Course 04 remove screenshot labels

on:
  push:
    paths:
      - '.github/workflows/course04-remove-screenshot-labels.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove screenshot labels and references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('course/04.html')
          s = p.read_text(encoding='utf-8')

          # Captions: <b>스크린샷 01</b> — ... -> ...
          s = re.sub(r'<b>스크린샷\s+\d{2}</b>\s*—\s*', '', s)

          # General wording that does not need a screenshot label.
          s = s.replace('4부의 실제 스크린샷과 명령 예시는', '4부의 실제 화면과 명령 예시는')
          s = s.replace('스크린샷 09에서는 실제 READ가', '이 예에서는 실제 READ가')
          s = s.replace('스크린샷 13에서 현재 instruction은', '이 예에서 현재 instruction은')
          s = s.replace('스크린샷 13에서는 C13Dh로 실제 이동했습니다.', '이 예에서는 C13Dh로 실제 이동했습니다.')
          s = s.replace('이 스크린샷의 목적은', '이 화면의 목적은')

          # Final lab references such as (스크린샷 08), (스크린샷 12·13).
          s = re.sub(r'\s*\(스크린샷\s+[0-9]{2}(?:·[0-9]{2})*\)', '', s)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove screenshot labels from course 04'
          git push
