name: Course 04 caption wrap fix

on:
  push:
    paths:
      - '.github/workflows/course04-caption-wrap-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply caption wrap fix
        run: python3 .github/scripts/course04_caption_wrap_fix.py
      - name: Commit course update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git commit -m 'Fix course 04 screenshot caption clipping'
          git push
