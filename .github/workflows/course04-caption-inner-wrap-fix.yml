name: Course 04 caption inner wrap fix

on:
  push:
    paths:
      - '.github/workflows/course04-caption-inner-wrap-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply inner caption wrap fix
        run: python3 .github/scripts/course04_caption_inner_wrap_fix.py
      - name: Commit course update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git commit -m 'Wrap course 04 captions before card edge'
          git push
