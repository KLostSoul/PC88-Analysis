name: Course 04 final fix

on:
  push:
    paths:
      - '.github/workflows/course04-final-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final course 04 fixes
        run: python3 .github/scripts/course04_final_fix.py
      - name: Commit final course update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html README.md
          git commit -m 'Apply final course 04 corrections'
          git push
