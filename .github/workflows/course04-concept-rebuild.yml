name: Course 04 concept-first rebuild

on:
  push:
    paths:
      - '.github/workflows/course04-concept-rebuild.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild course 04
        run: python3 .github/scripts/course04_rebuild.py
      - name: Commit rebuilt course
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Rebuild course 04 around debugger concepts'
          git push
