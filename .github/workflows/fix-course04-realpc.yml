name: Fix course 04 real hardware wording

on:
  push:
    paths:
      - '.github/workflows/fix-course04-realpc.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update course 04 wording
        run: python3 .github/scripts/fix_course04_realpc.py
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git commit -m 'Clarify why course uses emulator instead of real hardware'
          git push
