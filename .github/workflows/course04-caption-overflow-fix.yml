name: Course 04 caption overflow fix

on:
  push:
    paths:
      - '.github/workflows/course04-caption-overflow-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply global caption overflow fix
        run: python3 .github/scripts/course04_caption_overflow_fix.py
      - name: Commit course update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git commit -m 'Prevent all course 04 captions from clipping'
          git push
