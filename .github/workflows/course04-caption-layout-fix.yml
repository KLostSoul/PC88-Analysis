name: Course 04 screenshot layout fix

on:
  push:
    paths:
      - '.github/workflows/course04-caption-layout-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply screenshot layout and caption fixes
        run: python3 .github/scripts/course04_caption_layout_fix.py
      - name: Commit course update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add course/04.html
          git commit -m 'Improve course 04 screenshot captions and spacing'
          git push
